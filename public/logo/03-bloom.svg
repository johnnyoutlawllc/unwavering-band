<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="unwavering.band">
  <defs>
    <linearGradient id="bloom-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A7C41"/>
      <stop offset="100%" stop-color="#2E5430"/>
    </linearGradient>
    <linearGradient id="bloom-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="bloom-mask">
      <rect x="30" y="0" width="40" height="100" fill="url(#bloom-fade)"/>
    </mask>
    <filter id="bloom-blur" x="-100%" y="-50%" width="300%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="bloom-clip">
      <rect width="100" height="100" rx="20"/>
    </clipPath>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bloom-field)"/>
  <g clip-path="url(#bloom-clip)">
    <g mask="url(#bloom-mask)">
      <rect x="44" y="0" width="12" height="100" fill="#FF6B35" opacity="0.85" filter="url(#bloom-blur)"/>
      <rect x="47" y="0" width="6" height="100" fill="#FF8A3D" opacity="0.95"/>
      <rect x="48.6" y="0" width="2.8" height="100" fill="#FFD9A8"/>
    </g>
  </g>
</svg>
